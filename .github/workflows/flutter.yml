name: Flutter CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Android folder is not committed yet. Generate it in a scratch
      # directory and copy only the platform folder in, so the template never
      # overwrites our lib/, test/ or pubspec.yaml.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.helixooo183 --project-name pixel_canvas /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Show toolchain
        run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-canvas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
